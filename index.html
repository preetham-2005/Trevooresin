    <title>TREVOORESIN | Bespoke Handcrafted Resin Art & Memorial Keepsakes</title>
    <meta name="description" content="Trevooresin: Luxury handcrafted resin art studio specializing in wedding floral preservation, pooja thalis, Krishna jhulas, geode wall clocks, personalized nameplates, and bespoke resin decor." />
    
    <!-- Open Graph & Social Sharing -->
    <meta property="og:title" content="TREVOORESIN | Bespoke Handcrafted Resin Art" />

    <!-- Google Fonts: Cormorant Garamond, Cinzel, Plus Jakarta Sans -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Early PWA Install Prompt Capture and SW Registration -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Trevooresin Service Worker registered:', reg.scope);
          }).catch(function(err) {
            console.warn('Trevooresin Service Worker registration failed:', err);
          });
        });
      }
    </script>
